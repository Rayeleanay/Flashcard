<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <title>Document</title>
</head>
<body>
    <header class="cabecalho">
        <h1>DESVENDANDO FAKE NEWS</h1>
        <nav>
            <a href="#">Inicio</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://braziljournal.com" alt="Elefante" class="cartao-imagem">
                    <p>Elefantes pesam apenas 100Kg!</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://braziljournal.com" alt="Elefante" class="cartao-imagem">
                    <p>Elefantes podem pesar mais de 7 toneladas</p>
                </div>
            </div>
        </article>
    </main>
    <footer>
        <p>Projeto feito por Ray</p>
    </footer>
</body>
</html>
